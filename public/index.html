<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Agency WhatsApp</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <h1>🚀 Space Agency</h1>
    <p class="subtitle">WhatsApp Scheduler</p>

    <div class="card">
      <h2>Programar mensaje</h2>

      <label>Chat o grupo</label>
      <input id="chat" type="text" placeholder="Nombre del chat o grupo">

      <label>Mensaje</label>
      <textarea id="message" placeholder="Escribe tu mensaje..."></textarea>

      <label>Intervalo</label>
      <select id="interval">
        <option value="5">Cada 5 minutos</option>
        <option value="10">Cada 10 minutos</option>
        <option value="20">Cada 20 minutos</option>
        <option value="30">Cada 30 minutos</option>
        <option value="60">Cada 1 hora</option>
        <option value="180">Cada 3 horas</option>
        <option value="1440">Cada 24 horas</option>
      </select>

      <button id="start">▶ Iniciar</button>
      <button id="stop">⏹ Detener</button>

      <div id="status">Estado: esperando...</div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
